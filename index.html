<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACK_OVERRIDE // Password Matrix & Timer</title>
    <!-- Fuentes Cyberpunk / Hacker -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-dark text-light">
    <div class="scanline-overlay"></div>

    <!-- Encabezado Principal -->
    <header class="cyber-header container-fluid py-3 border-bottom border-secondary">
        <div class="logo">
            <span class="glitch" data-text="SYSTEM_OVERRIDE">SYSTEM_OVERRIDE</span>
            <span class="sub-logo">[SECURITY_PROTOCOL_v4.09]</span>
        </div>
        <div class="status-bar d-flex gap-4">
            <div class="status-item">
                <span class="label">STATUS:</span>
                <span class="value blinking" id="sys-status">BYPASS_IN_PROGRESS</span>
            </div>
            <div class="status-item">
                <span class="label">RULES_PASSED:</span>
                <span class="value" id="passed-count">0 / 0</span>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="cyber-container container my-4">
        <div class="row g-4">
            
            <!-- Columna Izquierda: Temporizador (Hack the School) -->
            <section class="col-12 col-md-4">
                <div class="card bg-black text-light text-center p-4 border border-secondary shadow">
                    <h1 class="h3 fw-bold text-success">HACK THE SCHOOL</h1>
                    <h2 class="h6 text-muted mb-3">// SECTOR 01</h2>
                    
                    <div class="display-3 fw-bold my-3" id="temporizador">03:00</div>
                    
                    <div id="mensaje" class="alert alert-dark border border-secondary text-light small py-2 mb-3">
                        Presioná INICIAR para comenzar
                    </div>
                    
                    <div class="d-flex gap-2 justify-content-center">
                        <button id="btnIniciar" class="btn btn-outline-success w-100 fw-bold">INICIAR</button>
                        <button id="btnReiniciar" class="btn btn-outline-warning w-100 fw-bold">REINICIAR</button>
                    </div>
                </div>
            </section>

            <!-- Columna Derecha: Entrada de Contraseña y Protocolos -->
            <section class="col-12 col-md-8 d-flex flex-column gap-4">
                
                <!-- Sección Input -->
                <div class="input-section card bg-black text-light p-3 border border-secondary">
                    <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center p-0 mb-2">
                        <h2 class="h5 m-0 text-success">// INPUT_KEYFRAME</h2>
                        <div class="char-count text-muted small">CHARS: <span id="length-val" class="text-light">0</span></div>
                    </div>
                    <div class="input-wrapper position-relative">
                        <textarea id="password-input" class="form-control bg-dark text-light border-secondary" placeholder="Escribe la contraseña requerida..." rows="3" spellcheck="false" autofocus></textarea>
                        <div class="input-glow"></div>
                    </div>
                    <div class="progress-bar-container mt-3">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>
                </div>

                <!-- Sección de Reglas -->
                <div class="rules-section card bg-black text-light p-3 border border-secondary">
                    <div class="rules-header mb-2">
                        <h2 class="h5 text-success m-0">// PROTOCOLS_INSPECTION</h2>
                    </div>
                    <div id="rules-container" class="rules-list">
                        <!-- Las reglas se renderizan dinámicamente desde JS -->
                    </div>
                </div>

            </section>
        </div>

        <!-- Modal de Victoria -->
        <section id="win-modal" class="modal hidden">
            <div class="modal-content card">
                <h1 class="glitch-text">ACCESS GRANTED</h1>
                <p>Has burlado la matriz de seguridad con éxito.</p>
                <button id="restart-btn" class="cyber-btn">REINICIAR PROTOCOLO</button>
            </div>
        </section>
    </main>

    <!-- Scripts JavaScript -->
    <script src="js/app.js"></script>
    <script src="js/script.js" defer></script>
</body>
</html>
